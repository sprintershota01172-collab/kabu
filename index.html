  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Noto Sans JP', sans-serif;
    }
    .font-cyber {
      font-family: 'Rajdhani', 'Noto Sans JP', sans-serif;
    }
    .font-orbitron {
      font-family: 'Orbitron', sans-serif;
    }

    /* 極上の滑らかトランジション */
    .tab-content {
      position: absolute;
      inset: 0;
      opacity: 0;
      visibility: hidden;
      transform: translateY(8px) scale(0.99);
      transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
      z-index: 0;
      pointer-events: none;
    }
    .tab-content.active {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
      z-index: 10;
      pointer-events: auto;
    }

    /* スクロールバーのデザイン */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.3); }
    ::-webkit-scrollbar-thumb { background: rgba(6, 182, 212, 0.6); border-radius: 9999px; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* iOSガード */
    input[type="date"], input[type="text"], input[type="number"], select {
      -webkit-appearance: none; appearance: none; box-sizing: border-box;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-950 via-slate-900 to-slate-950 text-slate-100 h-dvh w-screen overflow-hidden flex flex-col selection:bg-cyan-500 selection:text-white">

  <input type="file" id="importFile" accept=".json" class="hidden">
  <datalist id="stockHistoryList"></datalist>
  <datalist id="memoHistoryList"></datalist>

  <!-- =========================================================
       1. コンパクト・ヘッダー
  ========================================================== -->
  <header class="bg-slate-950/80 backdrop-blur-md border-b border-slate-800/80 px-3 py-1.5 flex justify-between items-center z-20 shrink-0">
    <div class="flex items-center gap-2">
      <!-- クールなSVGチャートアイコン -->
      <div class="w-6 h-6 rounded-lg bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center shadow-lg shadow-cyan-500/20">
        <svg class="w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path>
        </svg>
      </div>
      <div class="leading-none">
        <h1 class="text-xs font-orbitron font-bold text-white tracking-widest mt-0.5">TRADE LOG</h1>
        <div class="flex items-center gap-1.5 mt-0.5">
          <span class="text-slate-400 text-[9px] font-cyber uppercase tracking-wider">Total Profit:</span>
          <span id="miniTotalProfit" class="font-cyber font-bold text-cyan-400 text-[11px]">0 円</span>
        </div>
      </div>
    </div>
    <div class="flex items-center gap-1 shrink-0">
      <button onclick="resetAllData()" class="bg-slate-900 text-rose-400 border border-slate-800 px-2 py-1 rounded-md text-[10px] font-bold transition hover:bg-slate-800">初期化</button>
      <button onclick="triggerImport()" class="bg-slate-900 text-slate-300 border border-slate-800 px-2 py-1 rounded-md text-[10px] font-bold transition hover:bg-slate-800">復元</button>
      <button onclick="exportJson()" class="bg-cyan-600/90 text-white px-2 py-1 rounded-md text-[10px] font-bold shadow transition hover:bg-cyan-500">保存</button>
      <button onclick="exportCsv()" class="bg-blue-600/90 text-white px-2 py-1 rounded-md text-[10px] font-bold shadow transition hover:bg-blue-500">CSV</button>
    </div>
  </header>

  <!-- =========================================================
       2. タブメニュー
  ========================================================== -->
  <nav class="bg-slate-900/40 border-b border-slate-800/80 px-2 py-1.5 shrink-0 flex items-center gap-1 overflow-x-auto no-scrollbar z-20">
    <button onclick="switchTab('dashboard')" id="tabBtn-dashboard" class="tab-btn active-tab px-3 py-1.5 text-[11px] font-bold rounded-full transition-all duration-300 bg-cyan-500 text-white shadow-lg shadow-cyan-500/20 whitespace-nowrap shrink-0">
      📈 ダッシュボード
    </button>
    <button onclick="switchTab('input')" id="tabBtn-input" class="tab-btn px-3 py-1.5 text-[11px] font-bold rounded-full transition-all duration-300 text-slate-400 hover:text-slate-200 hover:bg-slate-800 whitespace-nowrap shrink-0">
      ✏️ トレード登録
    </button>
    <button onclick="switchTab('history')" id="tabBtn-history" class="tab-btn px-3 py-1.5 text-[11px] font-bold rounded-full transition-all duration-300 text-slate-400 hover:text-slate-200 hover:bg-slate-800 whitespace-nowrap shrink-0">
      📋 取引履歴
    </button>
  </nav>

  <!-- =========================================================
       3. メイン画面
  ========================================================== -->
  <main class="flex-1 min-h-0 min-w-0 relative">

    <!-- ==============================================
         TAB 1: 資産ダッシュボード
    =============================================== -->
    <div id="tabContent-dashboard" class="tab-content active p-2 sm:p-3 flex flex-col gap-2 min-h-0">
      <section class="grid grid-cols-2 gap-2 shrink-0 h-auto">
        <div class="bg-slate-900/60 border border-slate-800/80 p-2.5 rounded-xl shadow-sm relative overflow-hidden">
          <div class="absolute top-0 left-0 w-1 h-full bg-cyan-500 rounded-l-xl"></div>
          <p class="text-[9px] text-slate-400 font-bold uppercase tracking-wider">累計実現損益</p>
          <p id="summaryTotalProfit" class="text-sm sm:text-base font-orbitron font-bold mt-0.5 text-white">0 円</p>
        </div>
        <div class="bg-slate-900/60 border border-slate-800/80 p-2.5 rounded-xl shadow-sm relative overflow-hidden">
          <div class="absolute top-0 left-0 w-1 h-full bg-blue-500 rounded-l-xl"></div>
          <p class="text-[9px] text-slate-400 font-bold uppercase tracking-wider">勝率 ＆ 回数</p>
          <p id="summaryWinRate" class="text-sm font-cyber font-bold mt-0.5 text-white">0 回 <span class="text-[9px] text-slate-400">(0勝)</span></p>
        </div>
        <div class="bg-slate-900/60 border border-slate-800/80 p-2.5 rounded-xl shadow-sm relative overflow-hidden">
          <div class="absolute top-0 left-0 w-1 h-full bg-indigo-500 rounded-l-xl"></div>
          <p class="text-[9px] text-slate-400 font-bold uppercase tracking-wider">平均利益 / 損失</p>
          <p id="summaryAvgProfitLoss" class="text-xs font-cyber font-bold mt-0.5 text-slate-200">-- / --</p>
        </div>
        <div class="bg-slate-900/60 border border-slate-800/80 p-2.5 rounded-xl shadow-sm relative overflow-hidden">
          <div class="absolute top-0 left-0 w-1 h-full bg-purple-500 rounded-l-xl"></div>
          <p class="text-[9px] text-slate-400 font-bold uppercase tracking-wider">プロフィットファクター</p>
          <p id="summaryPF" class="text-sm font-orbitron font-bold mt-0.5 text-purple-300">--</p>
        </div>
      </section>

      <section class="bg-slate-900/60 border border-slate-800/80 p-3 rounded-xl shadow-sm flex-1 flex flex-col min-h-0 relative">
        <h2 class="text-[10px] font-bold text-slate-300 mb-1 shrink-0 flex items-center gap-1.5 uppercase tracking-wider font-cyber">
          <span class="w-1.5 h-1.5 rounded-full bg-cyan-400"></span>
          Asset Chart
        </h2>
        <div class="relative flex-1 w-full h-full min-h-0">
          <canvas id="assetChart"></canvas>
        </div>
      </section>
    </div>

    <!-- ==============================================
         TAB 2: トレード登録画面
    =============================================== -->
    <div id="tabContent-input" class="tab-content p-2 sm:p-3 flex flex-col min-h-0 overflow-y-auto">
      <section class="bg-slate-900/60 border border-slate-800/80 p-3 rounded-xl shadow-sm w-full flex flex-col">
        
        <div class="flex justify-between items-center mb-3">
          <h2 id="formTitle" class="text-xs font-bold text-white flex items-center gap-1.5 font-cyber uppercase tracking-wider">
            <span class="text-cyan-400 text-sm font-black">+</span> New Entry
          </h2>
          <button id="cancelEditBtn" onclick="resetForm()" class="hidden text-[10px] text-rose-300 bg-rose-950/50 border border-rose-800/50 px-2 py-0.5 rounded-md hover:bg-rose-900 transition-colors">
            [×] Cancel
          </button>
          <div id="amountBadgeWrap" class="text-right">
            <span class="text-slate-500 text-[9px] block leading-none font-cyber">ESTIMATED VALUE</span>
            <span id="previewTotalVal" class="font-cyber font-bold text-cyan-400 text-xs">0 円</span>
          </div>
        </div>

        <form id="tradeForm" class="flex flex-col gap-2">
          <input type="hidden" id="editTradeId" value="">
          
          <div class="grid grid-cols-2 gap-x-3 gap-y-2">
            <div>
              <label class="block text-[10px] font-medium text-slate-400 mb-0.5">決済日</label>
              <input type="date" id="tradeDate" required class="w-full h-7 bg-slate-950 border border-slate-700/80 rounded-md px-2 text-[11px] text-white focus:outline-none focus:border-cyan-500 transition-colors">
            </div>
            <div>
              <label class="block text-[10px] font-medium text-slate-400 mb-0.5">売買区分</label>
              <select id="tradeType" class="w-full h-7 bg-slate-950 border border-slate-700/80 rounded-md px-1.5 text-[11px] text-white focus:outline-none focus:border-cyan-500 transition-colors">
                <option value="売">売却 (損益を計算)</option>
                <option value="買">購入 (記録のみ)</option>
              </select>
            </div>
            <div>
              <label class="block text-[10px] font-medium text-slate-400 mb-0.5">銘柄名・コード</label>
              <input type="text" id="tradeStock" list="stockHistoryList" placeholder="例: 7203" required class="w-full h-7 bg-slate-950 border border-slate-700/80 rounded-md px-2 text-[11px] text-white focus:outline-none focus:border-cyan-500 transition-colors">
            </div>
            <div>
              <label class="block text-[10px] font-medium text-slate-400 mb-0.5">口座</label>
              <select id="tradeAccount" class="w-full h-7 bg-slate-950 border border-slate-700/80 rounded-md px-1.5 text-[11px] text-white focus:outline-none focus:border-indigo-500/50 transition-colors">
                <option value="特定">特定口座</option>
                <option value="NISA(成長)">NISA (成長)</option>
                <option value="NISA(つみたて)">NISA (つみたて)</option>
                <option value="一般">一般口座</option>
              </select>
            </div>
            <div>
              <label class="block text-[10px] font-medium text-slate-400 mb-0.5">数量 (株)</label>
              <input type="number" id="tradeQty" min="1" step="1" placeholder="100" required class="w-full h-7 bg-slate-950 border border-slate-700/80 rounded-md px-2 text-[11px] text-white font-cyber focus:outline-none focus:border-cyan-500 transition-colors">
            </div>
            <div>
              <label class="block text-[10px] font-medium text-slate-400 mb-0.5">手数料・税金 (円)</label>
              <input type="number" id="tradeFee" min="0" step="any" value="0" required class="w-full h-7 bg-slate-950 border border-slate-700/80 rounded-md px-2 text-[11px] text-white font-cyber focus:outline-none focus:border-cyan-500 transition-colors">
            </div>
            <div id="buyPriceContainer" class="transition-opacity duration-300">
              <label class="block text-[10px] font-medium text-slate-300 mb-0.5">取得単価 (買った額)</label>
              <input type="number" id="tradeBuyPrice" min="1" step="any" placeholder="2000" class="w-full h-7 bg-slate-950 border border-slate-700/60 rounded-md px-2 text-[11px] text-white font-cyber focus:outline-none focus:border-cyan-500 transition-colors">
            </div>
            <div>
              <label class="block text-[10px] font-medium text-cyan-400/80 mb-0.5">約定単価 (売った額)</label>
              <input type="number" id="tradePrice" min="1" step="any" placeholder="2500" required class="w-full h-7 bg-slate-950 border border-cyan-900/60 rounded-md px-2 text-[11px] text-white font-cyber focus:outline-none focus:border-cyan-500 transition-colors">
            </div>
            <div>
              <label class="block text-[10px] font-medium text-slate-400 mb-0.5">メモ (任意)</label>
              <input type="text" id="tradeMemo" list="memoHistoryList" placeholder="理由など" class="w-full h-7 bg-slate-950 border border-slate-700/80 rounded-md px-2 text-[11px] text-white focus:outline-none focus:border-cyan-500 transition-colors">
            </div>
            <div id="tradeProfitContainer" class="transition-opacity duration-300">
              <label class="block text-[10px] font-medium text-blue-400/80 mb-0.5">実現損益 <span class="text-[8px]">(自動計算)</span></label>
              <input type="number" id="tradeProfit" step="any" readonly class="w-full h-7 bg-slate-950/50 border border-blue-800/50 rounded-md px-2 text-[11px] text-blue-300 font-cyber font-bold outline-none cursor-default">
            </div>
          </div>

          <div class="mt-2">
            <button type="submit" class="w-full bg-gradient-to-r from-cyan-600 to-blue-600 hover:brightness-110 text-white font-bold h-9 rounded-lg text-[11px] transition-all shadow-lg active:scale-[0.98] flex items-center justify-center gap-1.5 font-cyber uppercase tracking-widest">
              Save Entry
            </button>
          </div>
        </form>
      </section>
    </div>

    <!-- ==============================================
         TAB 3: 取引履歴一覧
    =============================================== -->
    <div id="tabContent-history" class="tab-content p-2 sm:p-3 flex flex-col min-h-0">
      <div class="bg-slate-900/60 border border-slate-800/80 rounded-xl flex-1 flex flex-col min-h-0 overflow-hidden shadow-sm w-full">
        <div class="px-3 py-2 border-b border-slate-800/80 flex justify-between items-center shrink-0">
          <h2 class="text-[11px] font-bold text-slate-200 font-cyber uppercase tracking-wider">📋 History</h2>
          <span class="text-[10px] text-slate-400 font-medium font-cyber">
            Total: <span id="recordCountBadge" class="text-cyan-400 font-bold">0</span>
          </span>
        </div>
        <div class="flex-1 overflow-y-auto min-h-0 relative">
          <table class="w-full text-left border-collapse">
            <thead class="sticky top-0 bg-slate-950/95 backdrop-blur z-10 shadow-sm">
              <tr class="border-b border-slate-800 text-[10px] font-bold text-slate-400 whitespace-nowrap">
                <th class="py-1.5 px-2">日付</th>
                <th class="py-1.5 px-2">銘柄</th>
                <th class="py-1.5 px-2 text-right">数量</th>
                <th class="py-1.5 px-2 text-right">単価 <span class="text-[8px] font-normal">(買/売)</span></th>
                <th class="py-1.5 px-2 text-right">損益</th>
                <th class="py-1.5 px-2 text-center">操作</th>
              </tr>
            </thead>
            <tbody id="tradeTableBody" class="divide-y divide-slate-800/60 text-[11px]">
              <!-- JSで追加 -->
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </main>

  <script>
    let trades = [];
    let chartInstance = null;

    // 滑らかタブ切り替え
    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.className = 'tab-btn px-3 py-1.5 text-[11px] font-bold rounded-full transition-all duration-300 text-slate-400 hover:text-slate-200 hover:bg-slate-800 whitespace-nowrap shrink-0';
      });

      const targetContent = document.getElementById(`tabContent-${tabId}`);
      if (targetContent) targetContent.classList.add('active');

      const targetBtn = document.getElementById(`tabBtn-${tabId}`);
      if (targetBtn) {
        targetBtn.className = 'tab-btn px-3 py-1.5 text-[11px] font-bold rounded-full transition-all duration-300 bg-cyan-600 text-white shadow-lg shadow-cyan-500/20 whitespace-nowrap shrink-0';
      }

      if (tabId === 'dashboard') setTimeout(renderChart, 50);
    }

    document.addEventListener('DOMContentLoaded', () => {
      const saved = localStorage.getItem('stock_trades_db');
      if (saved) { try { trades = JSON.parse(saved); } catch (e) { trades = []; } }

      document.getElementById('tradeDate').valueAsDate = new Date();
      
      const tradeTypeSelect = document.getElementById('tradeType');
      const buyPriceContainer = document.getElementById('buyPriceContainer');
      const buyPriceInput = document.getElementById('tradeBuyPrice');
      const tradeProfitContainer = document.getElementById('tradeProfitContainer');
      const tradeProfitInput = document.getElementById('tradeProfit');
      const qtyInput = document.getElementById('tradeQty');
      const priceInput = document.getElementById('tradePrice');
      const feeInput = document.getElementById('tradeFee');
      const previewTotalVal = document.getElementById('previewTotalVal');

      const calculateProfit = () => {
        if (tradeTypeSelect.value === '買') {
          tradeProfitInput.value = '0';
          return;
        }
        const qty = parseFloat(qtyInput.value) || 0;
        const buyPrice = parseFloat(buyPriceInput.value) || 0;
        const sellPrice = parseFloat(priceInput.value) || 0;
        const fee = parseFloat(feeInput.value) || 0;
        if (qty > 0 && buyPrice > 0 && sellPrice > 0) {
          tradeProfitInput.value = (sellPrice - buyPrice) * qty - fee;
        }
      };

      qtyInput.addEventListener('input', calculateProfit);
      buyPriceInput.addEventListener('input', calculateProfit);
      priceInput.addEventListener('input', calculateProfit);
      feeInput.addEventListener('input', calculateProfit);

      const handleTypeChange = () => {
        if (tradeTypeSelect.value === '買') {
          buyPriceContainer.classList.add('opacity-20', 'pointer-events-none');
          buyPriceInput.required = false;
          tradeProfitInput.value = '0';
          tradeProfitContainer.classList.add('opacity-20', 'pointer-events-none');
        } else {
          buyPriceContainer.classList.remove('opacity-20', 'pointer-events-none');
          buyPriceInput.required = true;
          tradeProfitContainer.classList.remove('opacity-20', 'pointer-events-none');
          calculateProfit();
        }
      };
      tradeTypeSelect.addEventListener('change', handleTypeChange);
      handleTypeChange();

      const updatePreview = () => {
        const qty = parseFloat(qtyInput.value) || 0;
        const price = parseFloat(priceInput.value) || 0;
        previewTotalVal.textContent = new Intl.NumberFormat('ja-JP').format(qty * price) + ' 円';
      };
      qtyInput.addEventListener('input', updatePreview);
      priceInput.addEventListener('input', updatePreview);

      document.getElementById('importFile').addEventListener('change', handleImportJson);

      switchTab('dashboard');
      render();
    });

    document.getElementById('tradeForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const editId = document.getElementById('editTradeId').value;
      const type = document.getElementById('tradeType').value;
      const profitVal = parseFloat(document.getElementById('tradeProfit').value);

      const tradeData = {
        id: editId ? Number(editId) : Date.now(),
        date: document.getElementById('tradeDate').value,
        account: document.getElementById('tradeAccount').value,
        stock: document.getElementById('tradeStock').value.trim(),
        type: type,
        qty: parseInt(document.getElementById('tradeQty').value, 10),
        buyPrice: type === '売' ? parseFloat(document.getElementById('tradeBuyPrice').value) || 0 : 0,
        price: parseFloat(document.getElementById('tradePrice').value),
        fee: parseFloat(document.getElementById('tradeFee').value) || 0,
        profit: (type === '売' && !isNaN(profitVal)) ? profitVal : 0,
        memo: document.getElementById('tradeMemo').value.trim()
      };

      if (editId) {
        const index = trades.findIndex(t => t.id === Number(editId));
        if (index !== -1) trades[index] = tradeData;
      } else {
        trades.push(tradeData);
      }

      saveData();
      render();
      resetForm();
      switchTab('history');
    });

    function resetForm() {
      document.getElementById('tradeForm').reset();
      document.getElementById('editTradeId').value = '';
      document.getElementById('tradeDate').valueAsDate = new Date();
      document.getElementById('tradeAccount').value = '特定';
      document.getElementById('tradeType').value = '売';
      document.getElementById('tradeType').dispatchEvent(new Event('change'));
      document.getElementById('previewTotalVal').textContent = '0 円';
      document.getElementById('formTitle').innerHTML = '<span class="text-cyan-400 text-sm font-black">+</span> New Entry';
      document.getElementById('cancelEditBtn').classList.add('hidden');
    }

    function editTrade(id) {
      const target = trades.find(t => t.id === id);
      if (!target) return;

      document.getElementById('editTradeId').value = target.id;
      document.getElementById('tradeDate').value = target.date;
      document.getElementById('tradeAccount').value = target.account || '特定';
      document.getElementById('tradeStock').value = target.stock;
      document.getElementById('tradeType').value = target.type;
      document.getElementById('tradeType').dispatchEvent(new Event('change'));
      
      document.getElementById('tradeQty').value = target.qty;
      document.getElementById('tradeBuyPrice').value = target.buyPrice || '';
      document.getElementById('tradePrice').value = target.price;
      document.getElementById('tradeFee').value = target.fee;
      document.getElementById('tradeProfit').value = target.profit;
      document.getElementById('tradeMemo').value = target.memo || '';
      document.getElementById('previewTotalVal').textContent = new Intl.NumberFormat('ja-JP').format(target.qty * target.price) + ' 円';

      document.getElementById('formTitle').innerHTML = '<span class="text-amber-400 font-black">✎</span> Edit Entry';
      document.getElementById('cancelEditBtn').classList.remove('hidden');
      switchTab('input');
    }

    function deleteTrade(id) {
      if (!confirm('この履歴を削除しますか？')) return;
      trades = trades.filter(t => t.id !== id);
      saveData();
      render();
    }

    function resetAllData() {
      if (confirm('全てのデータを初期化しますか？')) {
        trades = [];
        saveData();
        render();
        resetForm();
        switchTab('dashboard');
      }
    }

    function saveData() { localStorage.setItem('stock_trades_db', JSON.stringify(trades)); }

    function formatCurrency(num, showSign = false) {
      if (isNaN(num)) return '--';
      const formatted = new Intl.NumberFormat('ja-JP').format(num);
      if (showSign && num > 0) return `+${formatted} 円`;
      return `${formatted} 円`;
    }

    function render() {
      renderSummary();
      renderTable();
      if(document.getElementById('tabContent-dashboard').classList.contains('active')) renderChart();
      updateHistoryDatalists();
    }

    function updateHistoryDatalists() {
      const stocks = [...new Set(trades.map(t => t.stock).filter(Boolean))];
      const memos = [...new Set(trades.map(t => t.memo).filter(Boolean))];
      document.getElementById('stockHistoryList').innerHTML = stocks.map(s => `<option value="${s}">`).join('');
      document.getElementById('memoHistoryList').innerHTML = memos.map(m => `<option value="${m}">`).join('');
    }

    function renderSummary() {
      const totalTrades = trades.length;
      const totalProfit = trades.reduce((sum, t) => sum + (t.profit || 0), 0);
      const winTrades = trades.filter(t => t.profit > 0);
      const loseTrades = trades.filter(t => t.profit < 0);
      const winCount = winTrades.length;
      const loseCount = loseTrades.length;
      
      const totalWinProfit = winTrades.reduce((sum, t) => sum + t.profit, 0);
      const totalLoseLoss = Math.abs(loseTrades.reduce((sum, t) => sum + t.profit, 0));
      const avgWin = winCount > 0 ? Math.round(totalWinProfit / winCount) : 0;
      const avgLose = loseCount > 0 ? Math.round(totalLoseLoss / loseCount) : 0;

      let pf = '--';
      if (totalLoseLoss > 0) pf = (totalWinProfit / totalLoseLoss).toFixed(2);
      else if (totalWinProfit > 0) pf = '∞';

      const totalEl = document.getElementById('summaryTotalProfit');
      totalEl.textContent = formatCurrency(totalProfit, true);
      totalEl.className = 'text-sm sm:text-base font-orbitron font-bold mt-0.5 truncate ' + (totalProfit > 0 ? 'text-cyan-400' : totalProfit < 0 ? 'text-rose-400' : 'text-white');

      document.getElementById('summaryWinRate').innerHTML = `${totalTrades} 回 <span class="text-[9px] text-slate-300">(${winCount}勝)</span>`;
      document.getElementById('summaryAvgProfitLoss').innerHTML = `<span class="text-blue-400 font-cyber">${formatCurrency(avgWin, true)}</span> / <span class="text-rose-400 font-cyber">-${formatCurrency(avgLose)}</span>`;
      document.getElementById('summaryPF').textContent = pf;

      const miniTotalEl = document.getElementById('miniTotalProfit');
      miniTotalEl.textContent = formatCurrency(totalProfit, true);
      miniTotalEl.className = 'font-cyber font-bold text-[11px] ' + (totalProfit > 0 ? 'text-cyan-400' : totalProfit < 0 ? 'text-rose-400' : 'text-white');
      document.getElementById('recordCountBadge').textContent = totalTrades;
    }

    function renderTable() {
      const tbody = document.getElementById('tradeTableBody');
      tbody.innerHTML = '';
      const sortedTrades = [...trades].sort((a, b) => {
        if (a.date !== b.date) return new Date(b.date) - new Date(a.date);
        return b.id - a.id;
      });

      if (sortedTrades.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="py-10 text-center text-slate-400 text-[10px] font-cyber uppercase tracking-wider">No Records Found</td></tr>`;
        return;
      }

      sortedTrades.forEach(t => {
        const tr = document.createElement('tr');
        let profitClass = 'text-slate-300';
        if (t.profit > 0) profitClass = 'text-cyan-400 font-bold';
        if (t.profit < 0) profitClass = 'text-rose-400 font-bold';

        const formattedBuy = (t.type === '売' && t.buyPrice) ? new Intl.NumberFormat('ja-JP').format(t.buyPrice) : '-';
        const formattedSell = new Intl.NumberFormat('ja-JP').format(t.price);

        const typeBadge = t.type === '売'
          ? '<span class="text-[8px] px-1 bg-rose-500/20 text-rose-300 border border-rose-500/30 rounded ml-1">売</span>'
          : '<span class="text-[8px] px-1 bg-cyan-500/20 text-cyan-300 border border-cyan-500/30 rounded ml-1">買</span>';

        tr.innerHTML = `
          <td class="py-2 px-2 text-slate-300 whitespace-nowrap font-cyber text-[10px]">${t.date.slice(5)}</td>
          <td class="py-2 px-2 font-bold text-white max-w-[90px] truncate">${t.stock} ${typeBadge}</td>
          <td class="py-2 px-2 text-right whitespace-nowrap font-cyber">${new Intl.NumberFormat('ja-JP').format(t.qty)}</td>
          <td class="py-2 px-2 text-right whitespace-nowrap font-cyber">
            <div class="text-[9px] text-slate-400 leading-tight">${formattedBuy}</div>
            <div class="text-[11px] text-cyan-100 leading-tight">${formattedSell}</div>
          </td>
          <td class="py-2 px-2 text-right ${profitClass} whitespace-nowrap font-cyber">${t.type === '売' ? formatCurrency(t.profit, true) : '-'}</td>
          <td class="py-2 px-2 text-center whitespace-nowrap">
            <button onclick="editTrade(${t.id})" class="text-amber-300/80 hover:text-amber-300 text-[10px] mr-1">📝</button>
            <button onclick="deleteTrade(${t.id})" class="text-rose-400/80 hover:text-rose-400 text-[10px]">🗑</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function renderChart() {
      const ctx = document.getElementById('assetChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();

      const sortedForChart = [...trades].sort((a, b) => {
        if (a.date !== b.date) return new Date(a.date) - new Date(b.date);
        return a.id - b.id;
      });

      let cumulativeProfit = 0;
      const labels = [];
      const dataPoints = [];
      sortedForChart.forEach((t, i) => {
        cumulativeProfit += (t.profit || 0);
        labels.push(`${t.date.slice(5)}`);
        dataPoints.push(cumulativeProfit);
      });

      const gradient = ctx.createLinearGradient(0, 0, 0, 200);
      gradient.addColorStop(0, 'rgba(6, 182, 212, 0.4)');
      gradient.addColorStop(1, 'rgba(15, 23, 42, 0.0)');

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels.length > 0 ? labels : ['-'],
          datasets: [{
            label: '累計損益',
            data: dataPoints.length > 0 ? dataPoints : [0],
            borderColor: 'rgb(6, 182, 212)',
            backgroundColor: gradient,
            borderWidth: 2,
            pointBackgroundColor: 'rgb(59, 130, 246)',
            pointRadius: 2,
            fill: true,
            tension: 0.3
          }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          scales: {
            x: { display: false },
            y: {
              grid: { color: 'rgba(51, 65, 85, 0.3)' },
              ticks: { color: 'rgb(148, 163, 184)', font: { size: 9, family: 'Rajdhani' }, maxTicksLimit: 5 }
            }
          },
          plugins: { legend: { display: false } }
        }
      });
    }

    function exportJson() {
      if (trades.length === 0) return alert('データがありません。');
      const blob = new Blob([JSON.stringify(trades)], { type: 'application/json' });
      const link = document.createElement('a'); link.href = URL.createObjectURL(blob);
      link.download = `tradelog_${new Date().toISOString().slice(0,10)}.json`; link.click();
    }

    function triggerImport() { document.getElementById('importFile').click(); }
    function handleImportJson(e) {
      const file = e.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          trades = JSON.parse(evt.target.result);
          saveData(); render(); alert('復元しました');
        } catch (err) { alert('失敗しました'); } finally { e.target.value = ''; }
      };
      reader.readAsText(file);
    }

    function exportCsv() {
      if (trades.length === 0) return alert('データがありません。');
      const sorted = [...trades].sort((a, b) => new Date(b.date) - new Date(a.date));
      const csvRows = ['決済日,口座,銘柄,売買,数量,取得単価,約定単価,手数料,実現損益,メモ'];
      sorted.forEach(t => csvRows.push(`"${t.date}","${t.account || ''}","${t.stock}","${t.type}",${t.qty},${t.buyPrice||0},${t.price},${t.fee},${t.profit},"${t.memo||''}"`));
      const blob = new Blob(['\uFEFF' + csvRows.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a'); link.href = URL.createObjectURL(blob);
      link.download = `tradelog_${new Date().toISOString().slice(0,10)}.csv`; link.click();
    }
  </script>
</body>
</html>
